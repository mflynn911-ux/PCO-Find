<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCO Quick Lookup</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f9f9f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #0066cc; }
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        input { padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
        button { padding: 12px; font-size: 16px; background: #0066cc; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0051a2; }
        .result-card { background: #f4f6f9; padding: 15px; margin-top: 15px; border-radius: 6px; border-left: 5px solid #0066cc; }
        .result-card h3 { margin-top: 0; margin-bottom: 8px; color: #222; }
        .detail-row { margin: 4px 0; font-size: 14px; }
        .label { font-weight: 600; color: #555; }
        .error { color: #d9534f; text-align: center; }
        .loading { text-align: center; color: #666; font-style: italic; }
    </style>
</head>
<body>

    <div class="container">
        <h2>PCO Quick Lookup</h2>
        <div class="input-group">
            <input type="text" id="firstName" placeholder="Partial First Name">
            <input type="text" id="lastName" placeholder="Partial Last Name">
            <button onclick="searchPeople()">Search Database</button>
        </div>

        <div id="results"></div>
    </div>

    <script>
        // NOTE: Replace these with your Planning Center Personal Access Token credentials
        const APP_ID = "dad3a87dedda14acfd2d344aabba4238c7c0ab194a7da99925eb146420f1b77d";
        const SECRET = "pco_pat_192cc08ef7c7cb5b5680b2e9f55b8821f57a073c636a7b0132bb90f79d3fd90de12ba5cb";

        async function searchPeople() {
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const resultsDiv = document.getElementById('results');
            
            if (!firstName && !lastName) {
                resultsDiv.innerHTML = "<p class='error'>Please enter at least a partial first or last name.</p>";
                return;
            }

            resultsDiv.innerHTML = "<p class='loading'>Searching Planning Center...</p>";

            const credentials = btoa(`${APP_ID}:${SECRET}`);
            let url = `https://api.planningcenteronline.com/people/v2/people?include=households`;
            
            if (firstName) url += `&where[first_name][contains]=${encodeURIComponent(firstName)}`;
            if (lastName) url += `&where[last_name][contains]=${encodeURIComponent(lastName)}`;

            try {
                const response = await fetch(url, {
                    headers: {
                        'Authorization': `Basic ${credentials}`
                    }
                });

                if (!response.ok) throw new Error('API request failed. Check credentials or network.');

                const data = await response.json();
                displayResults(data);
            } catch (error) {
                resultsDiv.innerHTML = `<p class='error'>Error: ${error.message}</p>`;
            }
        }

        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            if (!data.data || data.data.length === 0) {
                resultsDiv.innerHTML = "<p style='text-align: center;'>No matches found.</p>";
                return;
            }

            let html = `<h3>Found ${data.data.length} match(es):</h3>`;
            data.data.forEach(person => {
                const attr = person.attributes;
                html += `
                    <div class="result-card">
                        <h3>${attr.name || (attr.first_name + ' ' + attr.last_name)}</h3>
                        <div class="detail-row"><span class="label">Email:</span> ${attr.primary_email || 'None'}</div>
                        <div class="detail-row"><span class="label">Phone:</span> ${attr.primary_phone || 'None'}</div>
                        <div class="detail-row"><span class="label">Membership:</span> ${attr.membership || 'N/A'}</div>
                    </div>
                `;
            });
            resultsDiv.innerHTML = html;
        }
    </script>
</body>
</html>
