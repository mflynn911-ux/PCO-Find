<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCO Quick Lookup</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f9f9f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 650px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #0066cc; }
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        input { padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
        button { padding: 12px; font-size: 16px; background: #0066cc; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0051a2; }
        .result-card { background: #f4f6f9; padding: 15px; margin-top: 15px; border-radius: 6px; border-left: 5px solid #0066cc; }
        .result-card h3 { margin-top: 0; margin-bottom: 8px; color: #222; }
        .detail-row { margin: 4px 0; font-size: 14px; }
        .label { font-weight: 600; color: #555; }
        .error { color: #d9534f; text-align: center; }
        .loading { text-align: center; color: #666; font-style: italic; }
        .cred-box { background: #fff3cd; padding: 12px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #ffeeba; }
    </style>
</head>
<body>

    <div class="container">
        <h2>PCO Quick Lookup</h2>
        
        <div class="cred-box">
            <div style="font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #856404;">PCO Credentials (Saved by browser keychain/autofill):</div>
            <input type="text" id="pcoAppId" placeholder="App ID (Public Key)" autocomplete="username" style="margin-bottom: 8px; width: 100%; box-sizing: border-box;">
            <input type="password" id="pcoSecret" placeholder="Secret (Private Key)" autocomplete="current-password" style="width: 100%; box-sizing: border-box;">
        </div>

        <div class="input-group">
            <input type="text" id="firstName" placeholder="Partial First Name">
            <input type="text" id="lastName" placeholder="Partial Last Name">
            <button onclick="searchPeople()">Search Database</button>
        </div>

        <div id="results"></div>
    </div>

    <script>
        async function searchPeople() {
            const appId = document.getElementById('pcoAppId').value.trim();
            const secret = document.getElementById('pcoSecret').value.trim();
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const resultsDiv = document.getElementById('results');
            
            if (!appId || !secret) {
                resultsDiv.innerHTML = "<p class='error'>Please enter your Planning Center App ID and Secret.</p>";
                return;
            }
            if (!firstName && !lastName) {
                resultsDiv.innerHTML = "<p class='error'>Please enter at least a partial first or last name.</p>";
                return;
            }

            resultsDiv.innerHTML = "<p class='loading'>Searching Planning Center...</p>";

            const credentials = btoa(`${appId}:${secret}`);
            
            let pcoUrl = `https://api.planningcenteronline.com/people/v2/people?include=households,field_data.field_definition`;
            if (firstName) pcoUrl += `&where[first_name][contains]=${encodeURIComponent(firstName)}`;
            if (lastName) pcoUrl += `&where[last_name][contains]=${encodeURIComponent(lastName)}`;

            const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(pcoUrl)}`;

            try {
                const response = await fetch(proxyUrl, {
                    headers: {
                        'Authorization': `Basic ${credentials}`,
                        'User-Agent': 'PCO-Quick-Lookup-Tool (Personal Tool)'
                    }
                });

                if (!response.ok) throw new Error(`API request failed with status ${response.status}. Check your App ID and Secret.`);

                const data = await response.json();
                displayResults(data);
            } catch (error) {
                resultsDiv.innerHTML = `<p class='error'>Error: ${error.message}</p>`;
            }
        }

        function displayResults(data) {
            const resultsDiv = document.getElementById('results');
            if (!data.data || data.data.length === 0) {
                resultsDiv.innerHTML = "<p style='text-align: center;'>No matches found.</p>";
                return;
            }

            const includedMap = {};
            if (data.included) {
                data.included.forEach(item => {
                    includedMap[`${item.type}-${item.id}`] = item;
                });
            }

            let html = `<h3>Found ${data.data.length} match(es):</h3>`;
            
            data.data.forEach(person => {
                const attr = person.attributes;
                const fullName = attr.name || `${attr.first_name} ${attr.last_name}`;
                
                let deacon = 'None';
                let joinedDate = 'None';

                if (person.relationships && person.relationships.field_data && person.relationships.field_data.data) {
                    person.relationships.field_data.data.forEach(fdRef => {
                        const fdItem = includedMap[`${fdRef.type}-${fdRef.id}`];
                        if (fdItem && fdItem.attributes) {
                            const val = fdItem.attributes.value;
                            if (fdItem.relationships && fdItem.relationships.field_definition) {
                                const defRef = fdItem.relationships.field_definition.data;
                                const defItem = includedMap[`${defRef.type}-${defRef.id}`];
                                if (defItem && defItem.attributes) {
                                    const fieldName = defItem.attributes.name.toLowerCase();
                                    if (fieldName.includes('deacon')) {
                                        deacon = val;
                                    } else if (fieldName.includes('joined') || fieldName.includes('join date')) {
                                        joinedDate = val;
                                    }
                                }
                            }
                        }
                    });
                }

                let householdHtml = '';
                if (person.relationships && person.relationships.households && person.relationships.households.data) {
                    person.relationships.households.data.forEach(hRef => {
                        const hItem = includedMap[`${hRef.type}-${hRef.id}`];
                        if (hItem && hItem.attributes) {
                            householdHtml += `<div class="detail-row"><span class="label">Household:</span> ${hItem.attributes.name || 'Family'}</div>`;
                        }
                    });
                }

                const formattedJoined = joinedDate !== 'None' ? new Date(joinedDate).toLocaleDateString() : 'None';

                html += `
                    <div class="result-card">
                        <h3>${fullName}</h3>
                        <div class="detail-row"><span class="label">Email:</span> ${attr.primary_email || 'None'}</div>
                        <div class="detail-row"><span class="label">Phone:</span> ${attr.primary_phone || 'None'}</div>
                        <div class="detail-row"><span class="label">Membership:</span> ${attr.membership || 'N/A'}</div>
                        <div class="detail-row"><span class="label">Joined Date:</span> ${formattedJoined}</div>
                        <div class="detail-row"><span class="label">Deacon:</span> ${deacon}</div>
                        ${householdHtml}
                    </div>
                `;
            });
            resultsDiv.innerHTML = html;
        }
    </script>
</body>
</html>
